      covers: [macOS dmg (arm64/x64, ad-hoc signed, first-open), Windows installer (x64/arm64), Linux AppImage, system requirements]
      sources: [README.md, BUILD.md, .github/workflows/release.yml]
      status: done
    - page: start-here/first-launch
      covers: [splash, Start window (recent projects, keyboard nav), What's New window, self-update banner, About]
