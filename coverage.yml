# Nota Docs — coverage map (stage 0 inventory, Nota 0.50.1, 2026-10-07).
#
# Every user-facing feature of the app → the doc page that explains it.
# `sources` are paths in ../nota (the app repo); the nota-docs skill looks pages up by
# them when code changes. `mockup` is the ../nota-design file the screenshots can come
# from (absent → shoot the real app). `status`: todo | draft | done.
#
# Page slug = path under src/content/docs/ (EN) and src/content/docs/ru/ (RU).
# Truth order: code → CHANGELOG.md → FEATURES.md (stale: 0.42.1) → mockups.

version: 0.50.1

