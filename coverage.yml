# Findings from the inventory (resolve while writing the stages):
findings:
  - FEATURES.md stops at 0.42.1 — 0.42.2…0.50.1 (Session rebuild, Remote, Shutter Pattern, history, smart samples, stems, packs, self-update) exist only in CHANGELOG.md.
  - Nota Monolith (instrument 13) is in code but not in FEATURES.md and has no mockup.
  - Nota Strata (effect 15), Instrument Rack, Audio Effect Rack, Mixer, Modular, History, Export, Preferences sub-pages have no mockups → app shots.
  - Internal names differ from UI names — AutoPan = Nota Orbit, AutoGain = Nota Level, Amp = Nota Valve, WavetableSynth = Nota Aurora; MCP device table omits the "Nota " prefix for some kinds.
