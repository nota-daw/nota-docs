# Every screenshot used by <Shot id="…">. `npm run shots [-- <id-prefix>…]` takes them into
# src/assets/shots/{dark,light}/<id>.webp (see shots/shoot.mjs).
#
# source: app — the real app, rendered headlessly by shots/app in both themes (default).
#   scene: device   args: instrument | effect | midi (engine kind id), preset ("group/Name"),
#                         tab (text of a tab/segment to click, e.g. "Filter", "L"), card (index), kit
#   scene: main     args: view (arrangement | session | modular), select (demo track: Rhythm, Drums,
#                         Bass, Keys, Lead, Texture, Reverb), element (x:Name to crop to), width, height
#   scene: mixer · prefs (args: page = Settings sidebar index, 0 Audio … 8 Shortcuts)
#   scene: start · about · whatsnew · export · unsaved
# source: design — a ../nota-design mockup (dark only, shown in both site themes).
#   file + label ([data-screen-label]) or selector (CSS); inner: true keeps only the content of a
#   board cell (drops its label and caption).
# themes: [dark] / [light] to restrict; default is both for app, dark for design.
#
# Prefer app shots: they match the code and come in both themes. Use design only for what the
# app can't render (the phone UI of Nota Remote) or for card states a scene can't reach yet.
shots:

  # ── Start here · Basics
  - { id: start-here/start-window, source: app, scene: start }
  - { id: start-here/main-window, source: app, scene: main, args: {view: "arrangement"} }
  - { id: start-here/main-window-devices, source: app, scene: main, args: {view: "arrangement", select: "Keys"} }
